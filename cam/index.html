<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ແສງສີ ກ້ອງ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>ແສງສີ ກ້ອງ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--fg:#f2efe9;--mut:#8d8a84;--acc:#f2b134;--pan:#151517;--chip:#232327;--line:#2a2a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Noto Sans Lao',system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{flex:none;height:48px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.ic{min-width:44px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.on{color:var(--acc)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;overflow:hidden;background:#000}
#view{width:100%;height:100%;display:block}
.gl{position:absolute;background:rgba(255,255,255,.32);pointer-events:none}
#reticle{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:1.5px solid var(--acc);border-radius:50%;pointer-events:none;opacity:0;transform:scale(1.35);transition:opacity .5s,transform .25s}
#reticle.show{opacity:1;transform:scale(1)}
#hist{position:absolute;left:8px;top:8px;width:64px;height:32px;pointer-events:none;border-radius:4px;background:rgba(0,0,0,.28)}
#badge{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:11.5px;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:600;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6);pointer-events:none}
#blink{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
#blink.on{opacity:1;transition:none}
#flashOv{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:80}
#flashOv.on{opacity:1}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:var(--bg);font-size:14.5px;line-height:1.7}
#panel{flex:none;background:var(--pan);border-radius:18px 18px 0 0;padding-top:6px}
#tabs{display:flex;justify-content:center;gap:4px;padding:2px 12px 4px}
#tabs button{font-size:13px;padding:5px 13px;border-radius:14px;color:var(--mut)}
#tabs button.on{background:var(--chip);color:var(--fg)}
#pbody{height:132px;overflow-y:auto;overflow-x:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:18px;background:var(--chip);font-size:13px;border:1.5px solid transparent;white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.lk{padding:4px 4px 3px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;font-size:10.5px}
.chip.lk img{width:60px;height:56px;border-radius:9px;object-fit:cover;background:#333;display:block}
.chip.lk span{max-width:62px;overflow:hidden;text-overflow:ellipsis}
.chip.ln{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:5px 15px}
.chip.ln b{font-size:15px}.chip.ln small{font-size:10px;color:var(--mut)}
.sl{padding:0 18px 4px}
.slh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.slh b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#3b3b40;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--fg);margin-top:-9.5px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:3px;background:#3b3b40}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);border:0}
.hint{font-size:11px;color:var(--mut);padding:0 16px 6px;text-align:center}
.note{font-size:12.5px;color:var(--mut);padding:10px 18px;line-height:1.65}
.mini{display:block;margin:2px auto 6px;font-size:12px;color:var(--mut);padding:4px 12px;border-radius:12px;background:var(--chip)}
#modes{flex:none;display:flex;justify-content:center;gap:4px;padding:6px 0 0;background:var(--pan)}
#modes button{font-size:12.5px;padding:5px 12px;border-radius:14px;color:var(--mut)}
#modes button.on{color:var(--acc);font-weight:600}
#bottom{flex:none;height:calc(100px + env(safe-area-inset-bottom));padding:0 28px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--pan)}
#bGal{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--chip);justify-self:start;border:1.5px solid #333}
#bGal img{width:100%;height:100%;object-fit:cover;display:block}
#shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--fg);display:flex;align-items:center;justify-content:center}
#shutter span{width:60px;height:60px;border-radius:50%;background:var(--fg);transition:transform .1s,background .2s}
#shutter:active span{transform:scale(.88)}
#shutter.busy span{background:var(--acc);transform:scale(.8)}
#bFlip{justify-self:end;width:52px;height:52px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center}
#bFlip svg{width:24px;height:24px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet>header{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid var(--line)}
.sheet h2{font-size:16px;margin:0;font-weight:600}
.hb{padding:8px 12px;border-radius:10px;font-size:14px;min-width:64px;text-align:left}
.hb.r{text-align:right}.hb.danger{color:#ff6b5e}
.cnt{min-width:64px;text-align:right;color:var(--mut);font-size:13px;padding-right:10px}
#galGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 2px calc(2px + env(safe-area-inset-bottom));align-content:start}
#galGrid button{aspect-ratio:1;overflow:hidden;background:#1b1b1d}
#galGrid img{width:100%;height:100%;object-fit:cover;display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:70px 20px;font-size:14px;line-height:1.7}
#vStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#vCanvas{display:block;background:#000}
#vCtl{flex:none;max-height:36vh;overflow-y:auto;background:var(--pan);padding-top:8px;border-radius:18px 18px 0 0}
#vBar{flex:none;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--pan)}
.btn{flex:1;height:46px;border-radius:12px;background:var(--chip);font-size:15px;font-weight:500}
.btn.pri{flex:2;background:var(--acc);color:#1a1405;font-weight:600}
.btn:disabled{opacity:.6}
.set{flex:1;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.row .chips{padding:0}
.sw{width:50px;height:30px;border-radius:15px;background:#3b3b40;position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.secT{font-size:12px;color:var(--mut);padding:18px 18px 6px;letter-spacing:.3px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(34,34,37,.96);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:90;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#vid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ic" id="bFlash" aria-label="ແຟລຊ"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="ic" id="bGrid" aria-label="ເສັ້ນຕາຕະລາງ"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
    <button class="ic" id="bTimer" aria-label="ໂມງຈັບເວລາ"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="tLbl"></span></button>
    <button class="ic" id="bAspect" aria-label="ອັດຕາສ່ວນ">3:4</button>
    <button class="ic" id="bSettings" aria-label="ຕັ້ງຄ່າ"><svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="16" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg></button>
  </header>
  <main id="stage">
    <div id="frame">
      <canvas id="view"></canvas>
      <div id="grid" class="hide"><div class="gl" style="left:33.33%;top:0;bottom:0;width:1px"></div><div class="gl" style="left:66.66%;top:0;bottom:0;width:1px"></div><div class="gl" style="top:33.33%;left:0;right:0;height:1px"></div><div class="gl" style="top:66.66%;left:0;right:0;height:1px"></div></div>
      <div id="reticle"></div>
      <canvas id="hist" width="64" height="32"></canvas>
      <div id="badge"></div>
      <div id="count"></div>
      <div id="blink"></div>
    </div>
    <div id="msg" class="hide"><div id="msgT"></div><button class="btn pri" id="msgB" style="flex:none;padding:0 26px">ເປີດກ້ອງ</button></div>
  </main>
  <section id="panel">
    <nav id="tabs"></nav>
    <div id="pbody"></div>
  </section>
  <nav id="modes">
    <button data-m="auto">ອັດຕະໂນມັດ</button>
    <button data-m="a">A · ຮູຮັບແສງ</button>
    <button data-m="m">M · ແມນນວນ</button>
  </nav>
  <footer id="bottom">
    <button id="bGal" aria-label="ຄັງຮູບ"><img id="galThumb" alt="" class="hide"></button>
    <button id="shutter" aria-label="ຖ່າຍຮູບ"><span></span></button>
    <button id="bFlip" aria-label="ສະຫຼັບກ້ອງ"><svg viewBox="0 0 24 24"><path d="M4 9h13"/><path d="m14 6 3 3-3 3"/><path d="M20 15H7"/><path d="m10 12-3 3 3 3"/></svg></button>
  </footer>
</div>

<div id="gal" class="sheet hide">
  <header><button class="hb" id="galClose">‹ ກັບ</button><h2>ຄັງຮູບ</h2><span class="cnt" id="galCount"></span></header>
  <div id="galGrid"></div>
</div>

<div id="viewer" class="sheet hide">
  <header><button class="hb" id="vClose">‹ ກັບ</button><h2 id="vDate"></h2><button class="hb r danger" id="vDel">ລຶບ</button></header>
  <div id="vStage"><canvas id="vCanvas"></canvas></div>
  <div id="vCtl"></div>
  <div id="vBar"><button class="btn" id="vReset">ຄືນຄ່າ</button><button class="btn pri" id="vSave">ບັນທຶກ / ແບ່ງປັນ</button></div>
</div>

<div id="settings" class="sheet hide">
  <header><button class="hb" id="setClose">‹ ກັບ</button><h2>ຕັ້ງຄ່າ</h2><span class="cnt"></span></header>
  <div class="set" id="setBody"></div>
</div>

<div id="flashOv"></div>
<div id="toast"></div>
<video id="vid" playsinline muted autoplay></video>

<script>
'use strict';
/* ================= ຂໍ້ມູນພື້ນຖານ ================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const STOPS = [0.95, 1.2, 1.4, 2, 2.8, 4, 5.6, 8, 11, 16];
const ASPECTS = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '9:16': 9/16 };
const ASPECT_ORDER = ['3:4', '4:5', '1:1', '9:16'];

// ເລນຈຳລອງ (zoom = ຕັດພາບທຽບກັບເລນຫຼັກ ~26mm)
const LENSES = [
  { id:'28', mm:28, sub:'ກວ້າງ',   zoom:1.08, bm:0.55, fr:0.30, vig:0.16, glow:0    },
  { id:'35', mm:35, sub:'ຖະໜົນ',   zoom:1.35, bm:0.75, fr:0.26, vig:0.22, glow:0    },
  { id:'50', mm:50, sub:'ຄລາສສິກ', zoom:1.90, bm:1.00, fr:0.22, vig:0.34, glow:0.45 },
  { id:'75', mm:75, sub:'ພໍເທຣດ',  zoom:2.60, bm:1.30, fr:0.19, vig:0.20, glow:0.10 },
];
const LENSMAP = Object.fromEntries(LENSES.map(l => [l.id, l]));

// ໂທນສີ (ອອກແບບເອງ) — mat ຂຽນເປັນແຖວ (row-major)
const LOOKS_RAW = [
  { id:'nat',  name:'ທຳມະຊາດ',   con:1.04, sat:1.03, curve:0.15 },
  { id:'cls',  name:'ຄລາສສິກ',   mat:[1.04,0,-0.02, 0,1,0, -0.02,0,0.96], sat:0.88, con:1.05, curve:0.3, fade:0.03, lift:[0.01,0,-0.01], gain:[0.03,0.015,-0.02], vig:0.25 },
  { id:'viv',  name:'ສົດໃສ',     sat:1.3, con:1.12, curve:0.35, vig:0.15 },
  { id:'wf',   name:'ຟິມອົບອຸ່ນ', mat:[1.06,0.02,-0.04, 0,1,0, -0.03,0.04,0.92], sat:0.92, con:0.98, curve:0.4, fade:0.06, lift:[-0.02,0.01,0.03], gain:[0.05,0.02,-0.04], grain:0.05, vig:0.3 },
  { id:'sld',  name:'ສະໄລ້',     mat:[1.02,-0.02,0, -0.02,1.02,0, 0,-0.03,1.06], sat:1.22, con:1.2, curve:0.45, lift:[0,0,0.02], gain:[0.02,0.01,-0.01], vig:0.35, grain:0.02 },
  { id:'pst',  name:'ສີຈາງ',     sat:0.75, con:0.86, curve:0.1, fade:0.12, lift:[0.02,0.01,0.03], gain:[0.02,0.02,0] },
  { id:'cool', name:'ເງິນເຢັນ',   mat:[0.96,0.02,0.02, 0,0.98,0.02, 0,0.02,1.06], sat:0.8, con:1.1, curve:0.3, lift:[-0.01,0,0.03], gain:[0,0.01,0.02], vig:0.2 },
  { id:'cine', name:'ຮູບເງົາ',    sat:1.05, con:1.08, curve:0.3, lift:[-0.04,0.01,0.05], gain:[0.06,0.02,-0.05], fade:0.03, vig:0.35, grain:0.03 },
  { id:'bw',   name:'ຂາວດຳ',     bw:1, con:1.08, curve:0.3, vig:0.2, grain:0.03 },
  { id:'bwh',  name:'ຂາວດຳ ເຂັ້ມ', bw:1, bwW:[0.45,0.5,0.05], con:1.35, curve:0.5, vig:0.4, grain:0.06 },
  { id:'sep',  name:'ຊີເປຍ',     bw:1, bwW:[0.3,0.59,0.11], tone:[1.08,0.99,0.86], con:1.05, curve:0.3, fade:0.05, vig:0.3, grain:0.05 },
];
function normLook(L) {
  const m = L.mat || [1,0,0, 0,1,0, 0,0,1];
  const col = [m[0],m[3],m[6], m[1],m[4],m[7], m[2],m[5],m[8]]; // -> column-major ສຳລັບ GLSL
  return { id:L.id, name:L.name, mat:new Float32Array(col), sat:L.sat ?? 1, con:L.con ?? 1, curve:L.curve ?? 0, fade:L.fade ?? 0,
    lift:L.lift || [0,0,0], gain:L.gain || [0,0,0], bw:L.bw || 0, bwW:L.bwW || [0.2126,0.7152,0.0722], tone:L.tone || [1,1,1],
    grain:L.grain || 0, vig:L.vig || 0 };
}
const LOOKS = LOOKS_RAW.map(normLook);
const LOOKMAP = Object.fromEntries(LOOKS.map(l => [l.id, l]));

/* ================= Shader ================= */
const VS = `attribute vec2 p;varying vec2 v_uv;void main(){v_uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}`;
const FS = `precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform vec2 u_outSize, u_scale, u_focus;
uniform float u_mirror,u_exp,u_temp,u_tint,u_sat,u_con,u_curve,u_fade,u_bw,u_grain,u_vig,u_glow,u_intensity,u_seed,u_focusR,u_blur;
uniform mat3 u_mat;
uniform vec3 u_lift,u_gain,u_bwW,u_tone;
float hash(vec2 p){p=mod(p,512.0);p=fract(p*vec2(0.1031,0.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);}
float luma(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}
vec3 shoulder(vec3 x){vec3 t=max(x-0.8,0.0);return min(x,vec3(0.8))+0.2*(1.0-exp(-t/0.2));}
void main(){
  vec2 uv=v_uv;
  vec2 s=0.5+(uv-0.5)*u_scale;
  if(u_mirror>0.5) s.x=1.0-s.x;
  float aspect=u_outSize.x/u_outSize.y;
  vec3 col;
  float coc=0.0;
  if(u_blur>0.0){
    float d=length((uv-u_focus)*vec2(aspect,1.0));
    coc=smoothstep(u_focusR,u_focusR+0.3,d)*u_blur;
  }
  if(coc>0.0008){
    vec3 acc=vec3(0.0);float ws=0.0;
    float rot=hash(gl_FragCoord.xy)*6.2832;
    vec2 rad=vec2(coc/aspect,coc)*u_scale;
    for(int i=0;i<32;i++){
      float fi=float(i);
      float r=sqrt((fi+0.5)/32.0);
      float th=fi*2.39996+rot;
      vec3 c=texture2D(u_tex,s+vec2(cos(th),sin(th))*r*rad).rgb;
      float w=1.0+8.0*pow(luma(c),6.0);
      acc+=c*w;ws+=w;
    }
    col=acc/ws;
  } else col=texture2D(u_tex,s).rgb;
  if(u_glow>0.0){
    vec2 gr=vec2(0.007/aspect,0.007)*u_scale;vec3 g=vec3(0.0);

  c=mix(vec3(l),c,u_sat);
  c=mix(c,vec3(dot(c,u_bwW)),u_bw);

  c=mix(c,c*c*(3.0-2.0*c),u_curve);

  c=mix(vec3(u_fade),vec3(1.0),clamp(c,0.0,1.0));
  c=mix(base,c,u_intensity);
  vec2 vd=(uv-0.5)*vec2(aspect,1.0);

    float gs=max(u_outSize.y/1400.0,1.0);
    float n=vnoise(gl_FragCoord.xy/gs+u_seed*13.1)-0.5;
    c+=n*u_grain*2.0*(0.7-0.4*luma(c));

class Renderer {
  constructor(cv, preserve) {

    if (!gl) throw new Error('WebGL');
    this.gl = gl;
    const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));

    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    this.u = {};
    const n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(pr, i).name; this.u[nm] = gl.getUniformLocation(pr, nm); }
    this.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    this.sw = 1; this.sh = 1;
  }
  upload(src, w, h) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
    this.sw = w; this.sh = h;
  }
  draw(P, w, h) {
    const gl = this.gl;
    if (this.cv.width !== w) this.cv.width = w;
    if (this.cv.height !== h) this.cv.height = h;
    gl.viewport(0, 0, w, h);
    const U = buildUniforms(P, this.sw, this.sh, w, h);
    for (const k in U) {
      const l = this.u[k]; if (!l) continue; const v = U[k];
      if (typeof v === 'number') gl.uniform1f(l, v);
      else if (v.length === 2) gl.uniform2fv(l, v);
      else if (v.length === 3) gl.uniform3fv(l, v);
      else if (v.length === 9) gl.uniformMatrix3fv(l, false, v);
    }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
}

function blurAmount(P) {
  if (!P.blur) return 0;
  const lens = LENSMAP[P.lens] || LENSES[0];
  return Math.max(0, 0.035 * (1 / P.fstop - 1 / 11)) * lens.bm;
}
function buildUniforms(P, sw, sh, w, h) {
  const L = LOOKMAP[P.look] || LOOKS[0], lens = LENSMAP[P.lens] || LENSES[0];
  const sa = sw / sh, da = w / h;
  let sx = 1, sy = 1;
  if (sa > da) sx = da / sa; else sy = sa / da;
  sx /= P.zoom; sy /= P.zoom;
  const it = P.intensity;
  return {
    u_outSize:[w, h], u_scale:[sx, sy], u_mirror:P.mirror ? 1 : 0,
    u_exp:P.ev, u_temp:P.temp, u_tint:P.tint,
    u_mat:L.mat, u_sat:L.sat, u_con:L.con, u_curve:L.curve, u_fade:L.fade, u_lift:L.lift, u_gain:L.gain,
    u_bw:L.bw, u_bwW:L.bwW, u_tone:L.tone,

      return;

  hctx.drawImage(viewCv, 0, 0, 48, 64);

}

const toBlob = (cv, type, q) => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), type, q));
const dims = s => [s.naturalWidth || s.videoWidth || s.width, s.naturalHeight || s.videoHeight || s.height];

async function grabFrame() {
  let bmp = null;
  if (imgCap && S.hires && S.facing === 'environment') {
    try {
      const b = await imgCap.takePhoto();
      bmp = await createImageBitmap(b);
      // ຖ້າທິດທາງຮູບບໍ່ກົງກັບວິດີໂອ ໃຫ້ໃຊ້ເຟຣມວິດີໂອແທນ
      if ((bmp.width > bmp.height) !== (vid.videoWidth > vid.videoHeight)) { bmp.close && bmp.close(); bmp = null; }
    } catch (e) { bmp = null; }
  }
  const sw = bmp ? bmp.width : vid.videoWidth, sh = bmp ? bmp.height : vid.videoHeight;
  const s = Math.min(1, MAXTEX / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  c.getContext('2d').drawImage(bmp || vid, 0, 0, c.width, c.height);
  if (bmp && bmp.close) bmp.close();
  return c;
}

function outDims(src, P, maxLong) {
  const [sw, sh] = dims(src), a = ASPECTS[P.aspect] || 0.75;
  let rw, rh;
  if (sw / sh > a) { rh = sh; rw = sh * a; } else { rw = sw; rh = sw / a; }
  rw /= P.zoom; rh /= P.zoom;
  let lim = MAXTEX; if (maxLong) lim = Math.min(lim, maxLong);
  const k = Math.min(1, lim / Math.max(rw, rh));
  return [Math.max(2, Math.round(rw * k)), Math.max(2, Math.round(rh * k))];
}
async function renderOut(src, P, maxLong = 0, type, q) {
  const [sw, sh] = dims(src);
  const [w, h] = outDims(src, P, maxLong);
  work.upload(src, sw, sh);
  work.draw(P, w, h);
  const fmt = type || (S.format === 'png' ? 'image/png' : 'image/jpeg');
  return toBlob(workCv, fmt, q || 0.95);
}
function fname(ts, type) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `SaengsiCam_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${type === 'image/png' ? 'png' : 'jpg'}`;
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type:blob.type });
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ files:[file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; if (e.name === 'NotAllowedError') throw e; }
  }
  download(blob, name);
}

let busy = false;

async function shoot() {
  if (busy) return;

    const torch = S.flash && caps.torch && S.facing === 'environment';

    if (torch) { await track.applyConstraints({ advanced:[{ torch:true }] }).catch(() => {}); await sleep(400); }

    if (scr) $('#flashOv').classList.remove('on');

}

const db = {
  _d:null,
  open() {
    return this._d || (this._d = new Promise((res, rej) => {
      const r = indexedDB.open('saengsi-cam', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('shots', { keyPath:'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  },
  async tx(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction('shots', mode), req = fn(t.objectStore('shots'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(v) { return this.tx('readwrite', s => s.put(v)); },
  get(id) { return this.tx('readonly', s => s.get(id)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  all() { return this.tx('readonly', s => s.getAll()); },
  clear() { return this.tx('readwrite', s => s.clear()); },
};

  const n = document.createElement('div'); n.className = 'note';

    '• iPhone ບໍ່ອະນຸຍາດໃຫ້ເວັບປັບ ISO/ຊັດເຕີ/ໂຟກັດ ແລະ ໄຟແຟລຊ. Android ສ່ວນຫຼາຍໄດ້ (ແຖບ "ຮາດແວ" ໃນໂໝດ M).<br>' +
