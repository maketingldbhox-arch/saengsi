<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ແສງສີ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ແສງສີ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen photo editor. Library grid ↔ editor (top bar / image / tool panel / thumb tab bar).
   Deliberately single dark neutral theme: a slightly cool charcoal so the photo's own colors are judged without a tinted surround. */
:root{
  color-scheme: dark;
  --bg:#111214;          /* surround behind the photo */
  --panel:#18191c;       /* tool panel */
  --raise:#222429;       /* chips, buttons */
  --line:#2c2f35;
  --fg:#ecebe7;
  --muted:#8d9098;
  --accent:#73b6e6;      /* daylight blue: sliders, active tab */
  --accent-ink:#0b1a26;
  --warm:#f0b35b;        /* mask/heal handles */
  --danger:#ef6b6b;
  --f-ui:"Noto Sans Lao","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --tab-h:62px;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* ---------- Library ---------- */
.lib-head{display:flex;align-items:center;gap:10px;padding-block:14px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;flex:none;
  background:conic-gradient(from 200deg,#f0b35b,#ef6b6b,#b98be8,#73b6e6,#7fd1a6,#f0b35b)}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:-2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--raise);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2a2c}
.btn:disabled{opacity:.4}
.lib-tools{display:flex;gap:8px;align-items:center;padding-block:0 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none}
.lib-tools::-webkit-scrollbar{display:none}
.lib-count{color:var(--muted);font-size:13px;margin-right:auto;white-space:nowrap}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;align-content:start;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-bottom:90px}
@media (min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;aspect-ratio:1;max-width:100%;background:var(--raise);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .badge{position:absolute;left:6px;bottom:6px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(10,11,13,.72);color:var(--fg)}
.tile .check{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.25)}
.tile.sel .check{background:var(--accent);border-color:var(--accent)}
.tile.sel .check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tile.sel img{opacity:.75}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 24px;line-height:1.7}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:54px;padding:0 22px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.batchbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

/* ---------- Editor ---------- */
.topbar{display:flex;align-items:center;gap:2px;height:52px;flex:none;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--raise)}
.ib:disabled{opacity:.3}
.ib svg{width:22px;height:22px}
.top-title{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.export-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;margin-left:4px}
.stage{position:relative;flex:1;min-height:120px;overflow:hidden;background:var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(12,13,15,.78);color:var(--fg);font-size:12px;padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.badge-before{position:absolute;left:12px;top:10px;background:var(--warm);color:#1d1406;font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px;pointer-events:none}
.zoomtag{position:absolute;right:12px;top:10px;background:rgba(12,13,15,.78);font-family:var(--f-num);font-size:11px;padding:4px 8px;border-radius:8px;pointer-events:none}
.spinner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(17,18,20,.6)}
.spinner::after{content:"";width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.panel{flex:none;background:var(--panel);border-top:1px solid var(--line);max-height:44vh;overflow-y:auto;overscroll-behavior:contain;
  padding-block:6px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{flex:none;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-top:1px solid var(--line);height:var(--tab-h);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;border-radius:10px;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent)}
.tab .dot{position:absolute;top:9px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--warm)}

.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.row{padding:6px 0 2px}
.rl{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.rl .lb{font-size:14px}
.rl .en{font-size:11px;color:var(--muted)}
.rl output{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.row.changed .rl output{color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--trk,linear-gradient(90deg,var(--line),var(--line)))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--trk,var(--line))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#f4f3ef;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.6);border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#f4f3ef;border:0}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--raise);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:transparent;border-color:var(--accent);color:var(--accent)}
.chip svg{width:18px;height:18px}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:2px;margin:6px 0}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.swatches{display:flex;justify-content:space-between;padding:8px 2px}
.sw{width:32px;height:32px;border-radius:50%;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.sw.mod::after{content:"";position:absolute;right:-1px;top:-1px;width:8px;height:8px;border-radius:50%;background:var(--warm);border:2px solid var(--panel)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.btnrow .btn{height:38px;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:14px}
.sw-t{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw-t::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#f4f3ef;transition:transform .15s}
.sw-t.on{background:var(--accent)}
.sw-t.on::after{transform:translateX(18px)}
.note{color:var(--muted);font-size:12.5px;line-height:1.6;margin:6px 0}
.hist{width:100%;height:64px;display:block;margin:6px 0 2px;border-radius:8px;background:#0e0f11}
.curvebox{position:relative;width:100%;max-width:340px;margin:6px auto 0;aspect-ratio:1;max-height:34vh}
.curvebox canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px;background:#0e0f11}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:6px 0}
.pcard{display:flex;flex-direction:column;gap:5px;text-align:left}
.pcard .pimg{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--raise);overflow:hidden;border:2px solid transparent}
.pcard .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pcard.on .pimg{border-color:var(--accent)}
.pcard span{font-size:12px;line-height:1.3;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.user span{color:var(--warm)}
.inline-form{display:flex;gap:8px;padding:6px 0}
.inline-form input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;user-select:text;-webkit-user-select:text}
.masklist{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.mchip{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;background:var(--raise);font-size:13px;border:1px solid transparent}
.mchip.on{border-color:var(--warm);color:var(--warm)}
.mchip svg{width:16px;height:16px}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sheet .opt{height:58px;border-radius:12px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent;font-size:14px}
.sheet .opt small{color:var(--muted);font-size:11px;font-family:var(--f-num)}
.sheet .opt.on{border-color:var(--accent);color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.results figure{margin:0;display:flex;flex-direction:column;gap:6px}
.results img{width:100%;border-radius:10px;display:block;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.results figcaption{font-size:11px;color:var(--muted);font-family:var(--f-num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f4f3ef;color:#141518;font-weight:500;padding:10px 16px;border-radius:999px;z-index:60;font-size:13px;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.ai-btn{background:linear-gradient(90deg,#2a2440,#1f2c3a);border:1px solid #3b3557;height:36px;font-size:13px}
.ai-spin{width:46px;height:46px;margin:6px auto 10px;border-radius:50%;background:conic-gradient(from 0deg,#f0b35b,#ef6b6b,#b98be8,#73b6e6,#7fd1a6,#f0b35b);
  -webkit-mask:radial-gradient(circle,transparent 15px,#000 16px);mask:radial-gradient(circle,transparent 15px,#000 16px);animation:spin 1.1s linear infinite}
.callout{background:var(--raise);border:1px solid #3b3557;border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}
.callout p{margin:0;font-size:13px;line-height:1.5}
.ta{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px 12px;font:inherit;resize:vertical;user-select:text;-webkit-user-select:text;margin:6px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted)}
.field > input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;user-select:text;-webkit-user-select:text}
.link{color:var(--accent);font-size:13px}
.bg-wrap{border-radius:12px;overflow:hidden;margin:8px 0;background:repeating-conic-gradient(#2a2c31 0% 25%,#1c1d21 0% 50%) 0 0/20px 20px;display:flex;justify-content:center}
.bg-prev{max-height:42vh;max-width:100%;display:block}
.colorpick{width:44px;height:36px;border:0;border-radius:999px;background:none;padding:0;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:0s!important}}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<!-- Library -->
<section id="lib" class="screen">
  <header class="lib-head">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div><h1>ແສງສີ</h1><small>ແຕ່ງຮູບ ແລະ ສີ ໃນມືຖື</small></div>
    </div>
    <button class="ib" id="btnAiSet" aria-label="ຕັ້ງຄ່າ AI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    <button class="btn ghost" id="btnSelect">ເລືອກ</button>
  </header>
  <div class="lib-tools">
    <span class="lib-count" id="libCount"></span>
    <button class="btn ai-btn" id="btnGen">✦ AI ສ້າງພາບ</button>
  </div>
  <div class="grid" id="grid"></div>
  <button class="fab" id="btnAdd"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>ເພີ່ມຮູບ</button>
  <div class="batchbar" id="batchbar" hidden>
    <button class="btn" id="bPreset">ໃສ່ໂປຣເຊັດ</button>
    <button class="btn" id="bPaste">ວາງການແກ້ໄຂ</button>
    <button class="btn primary" id="bExport">ສົ່ງອອກ</button>
    <button class="btn danger" id="bDelete">ລຶບ</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" multiple hidden>
</section>

<!-- Editor -->
<section id="ed" class="screen" hidden>
  <header class="topbar">
    <button class="ib" id="btnBack" aria-label="ກັບຄືນ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="top-title" id="edTitle"></div>
    <button class="ib" id="btnUndo" aria-label="ຍົກເລີກ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ib" id="btnRedo" aria-label="ເຮັດຄືນ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="ib" id="btnCompare" aria-label="ກົດຄ້າງເພື່ອເບິ່ງກ່ອນແກ້"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/><path d="M12 4h7a2 2 0 012 2v12a2 2 0 01-2 2h-7z" fill="currentColor" stroke="none" opacity=".35"/></svg></button>
    <button class="export-btn" id="btnExport">ສົ່ງອອກ</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div class="badge-before" id="beforeTag" hidden>ກ່ອນແກ້</div>
    <div class="zoomtag" id="zoomTag" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="spinner" id="spin" hidden></div>
  </div>
  <div class="panel" id="panel"></div>
  <nav class="tabs" id="tabs"></nav>
</section>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ================= ແສງສີ — WebGL2 render engine ================= */
'use strict';

/* ---------- geometry (shared by shader and JS) ---------- */
// frame coords f∈[0,1]² of a crop rect → original image uv (0,0 = top-left)
function f2uv(fx, fy, crop, g, Wo, Ho) {
  const qx = crop.cx * Wo + (fx - 0.5) * crop.w * Wo;

function flatDev(S) {
  const out = {};

    for (const k in o) {
      if (!pre && DEV_SKIP.has(k)) continue;
      const v = o[k], p = pre ? pre + '.' + k : k;

}

  const d = flatDev(defaults());

      setPath(S, p, v.map(([x, y]) => [x, +(x + (y - x) * amt).toFixed(4)]));

}

const AI_KEYS = {
  exposure: [-2, 2], contrast: [-60, 60], highlights: [-100, 100], shadows: [-100, 100], whites: [-60, 60], blacks: [-60, 60],
  temp: [-60, 60], tint: [-40, 40], vibrance: [-60, 60], saturation: [-60, 40], texture: [-50, 50], clarity: [-50, 50], dehaze: [-40, 60],

  'grade.hi.h': [0, 360], 'grade.hi.s': [0, 40], bw: null

async function aiAdjust(style) {

    const text = `You are a professional photo retoucher. Look at this unedited photo and choose slider values for a non-destructive editor.
${style ? `The user wants this look (may be written in Lao): "${style}".` : 'Make it look natural, balanced and attractive: fix exposure, white balance and contrast.'}
Sliders and ranges (0 = no change): exposure (stops, -2..2), contrast, highlights, shadows, whites, blacks, temp (+ warmer), tint (+ magenta), vibrance, saturation, texture, clarity, dehaze (all -100..100, prefer moderate values),
"vignette.amount" (-100 darker edges..100), "grain.amount" (0..100), color grading "grade.sh.h"/"grade.mid.h"/"grade.hi.h" (hue 0-360) with "grade.sh.s"/"grade.mid.s"/"grade.hi.s" (strength 0..100),
per-color "hsl.h.N"/"hsl.s.N"/"hsl.l.N" (-100..100) where N: 0 red, 1 orange, 2 yellow, 3 green, 4 aqua, 5 blue, 6 purple, 7 magenta, and "bw" (true for black & white).
Only include sliders you change. Output only JSON: {"settings": {"exposure": 0.3, ...}, "note": "one short sentence in Lao explaining what you changed"}`;
    const r = await geminiCall({ model: c.visModel, text, signal: b.signal, onStatus: b.set, out: 'json', images: [{ mime: 'image/jpeg', b64: cvB64(scaledCanvas(st.img, 1024), 'image/jpeg', 0.88) }] });

        if (!r.image.length) found.append(h('p', { class: 'note', style: 'color:var(--warm)' }, 'key ນີ້ຍັງບໍ່ມີ model ແກ້/ສ້າງຮູບ. ສ່ວນຫຼາຍຕ້ອງເປີດ billing ໃນ Google AI Studio ກ່ອນ.'));
      } catch (e) { found.innerHTML = ''; found.append(h('p', { class: 'note', style: 'color:var(--danger)' }, '✗ ' + e.message)); }
    } }, 'ຄົ້ນຫາ model ທີ່ key ນີ້ໃຊ້ໄດ້')),
    found,
    status,
    h('div', { class: 'btnrow' },
      h('button', { class: 'btn primary', onclick: async () => {
        save(); status.textContent = 'ກຳລັງທົດສອບ…';
        try { const r = await geminiCall({ model: AIcfg().visModel, text: 'Reply with the single word OK.', onStatus: t => status.textContent = t }); status.textContent = '✓ ເຊື່ອມຕໍ່ໄດ້ · model: ' + r.model; status.style.color = 'var(--accent)'; }
        catch (e) { status.textContent = '✗ ' + e.message; status.style.color = 'var(--danger)'; }
      } }, 'ບັນທຶກ ແລະ ທົດສອບ'),
      h('button', { class: 'btn ghost', onclick: () => { save(); root.innerHTML = ''; if (st.cur && st.tab === 'ai') renderPanel(); } }, 'ປິດ'))].filter(Boolean));
  const bg = h('div', { class: 'sheet-bg', onclick: e => { if (e.target === bg) { save(); root.innerHTML = ''; if (st.cur && st.tab === 'ai') renderPanel(); } } }, sheet); root.append(bg);
}

/* ---------- save files (download capability / link / share) ---------- */
async function saveFiles(files) {
  const cap = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (cap) { for (const f of files) { try { await cap.save({ filename: f.name, data: f }); } catch (e) { if (!e || e.code !== 'declined') toast('ບັນທຶກບໍ່ໄດ້ຢູ່ບ່ອນນີ້'); break; } } return; }
  if (navigator.canShare && navigator.canShare({ files }) && /iphone|ipad/i.test(navigator.userAgent)) { try { await navigator.share({ files }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  for (const f of files) { const u = URL.createObjectURL(f), a = document.createElement('a'); a.href = u; a.download = f.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); }
  toast('ບັນທຶກແລ້ວ (ເບິ່ງໃນ Downloads)');
}

/* ---------- AI tab ---------- */
function aiPanel(p) {
  const c = AIcfg(), A = st.ai;
  if (!c.key) p.append(h('div', { class: 'callout' }, h('p', {}, 'ຟັງຊັນ AI ໃຊ້ Gemini API key ຂອງເຈົ້າເອງ.'), h('button', { class: 'btn primary', onclick: () => aiSettingsSheet() }, 'ໃສ່ API key')));
  p.append(sec('AI ປັບແສງ ແລະ ສີ · ຟຣີ'));
  const style = h('input', { id: 'aiStyle', placeholder: 'ແບບທີ່ຕ້ອງການ (ບໍ່ໃສ່ກໍໄດ້) ເຊັ່ນ: ອົບອຸ່ນ ສະຫວ່າງ ແບບໂຄສະນາ', value: LS.get('aiStyle', '') });
  p.append(h('div', { class: 'inline-form' }, style, h('button', { class: 'btn primary', onclick: () => { LS.set('aiStyle', style.value.trim()); aiAdjust(style.value.trim()); } }, 'ປັບໃຫ້')));
  p.append(h('p', { class: 'note' }, 'AI ເລືອກຄ່າ slider ໃຫ້, ປັບຕໍ່ ຫຼື ກັບຄືນໄດ້ຕາມປົກກະຕິ.'));

  p.append(sec('ລົບ ຫຼື ແກ້ສະເພາະບ່ອນ'));
  p.append(h('div', { class: 'seg' },
    h('button', { class: A.paint && !A.erase ? 'on' : '', onclick: () => { A.paint = true; A.erase = false; renderPanel(); } }, 'ທາບ່ອນທີ່ຈະແກ້'),
    h('button', { class: A.paint && A.erase ? 'on' : '', onclick: () => { A.paint = true; A.erase = true; renderPanel(); } }, 'ລຶບຮອຍທາ'),
    h('button', { class: !A.paint ? 'on' : '', onclick: () => { A.paint = false; renderPanel(); } }, 'ເລື່ອນຮູບ')));
  p.append(slider({ lo: 'ຂະໜາດແປງ', en: 'Size', id: 'aisize', min: 1, max: 30, def: 6, fmt: v => Math.round(v), get: () => A.size * 100, set: v => { A.size = v / 100; drawOverlay(); } }));
  const instr = h('input', { id: 'aiInstr', placeholder: 'ປ່ອຍວ່າງ = ລົບອອກ. ຫຼື ພິມ ເຊັ່ນ: ປ່ຽນເປັນໂຕະໄມ້', value: A.instr || '', oninput: e => A.instr = e.target.value });
  p.append(h('div', { class: 'inline-form' }, instr));
  const has = aiHasRegion();
  p.append(h('div', { class: 'btnrow' },
    h('button', { class: 'btn primary', disabled: !has, onclick: () => aiPatch((A.instr || '').trim()) }, (A.instr || '').trim() ? 'ແກ້ບ່ອນທີ່ທາ' : 'ລົບສິ່ງທີ່ທາ'),
    h('button', { class: 'btn ghost', disabled: !A.strokes.length, onclick: () => { A.strokes = []; st.R.dropMask('__ai'); renderPanel(); requestRender(); } }, 'ລ້າງຮອຍທາ')));
  if (!has) p.append(h('p', { class: 'note' }, 'ທາສີໃສ່ຮູບດ້ວຍນິ້ວດຽວ ໃຫ້ກວມສິ່ງທີ່ຢາກລຶບ (ຄົນ, ສາຍໄຟ, ຂີ້ເຫຍື້ອ…). ຊູມດ້ວຍສອງນິ້ວ.'));

  p.append(sec('ແກ້ທັງຮູບຕາມຄຳສັ່ງ'));
  const whole = h('textarea', { id: 'aiWhole', class: 'ta', rows: 2, placeholder: 'ເຊັ່ນ: ປ່ຽນທ້ອງຟ້າເປັນຕອນແລງ, ເພີ່ມໂຄມໄຟເທິງໂຕະ, ຈັດຫ້ອງໃຫ້ເປັນລະບຽບ', oninput: e => A.whole = e.target.value }, A.whole || '');
  p.append(whole);
  p.append(h('div', { class: 'btnrow' },
    h('button', { class: 'btn primary', onclick: () => aiWhole((A.whole || '').trim()) }, 'ສ້າງເປັນຮູບໃໝ່'),
    h('button', { class: 'btn', onclick: () => bgRemoveSheet() }, 'ລົບພື້ນຫຼັງ')));
  p.append(h('p', { class: 'note' }, 'ແກ້ທັງຮູບ ຈະໄດ້ຮູບໃໝ່ແຍກອອກມາ, ຮູບເດີມບໍ່ປ່ຽນ.'));

  if (st.cur.aiEdits) {
    p.append(sec('ຮູບນີ້ຖືກ AI ແກ້ ' + st.cur.aiEdits + ' ຄັ້ງ'));
    p.append(h('div', { class: 'btnrow' },
      st.cur.aiPrev ? h('button', { class: 'btn', onclick: () => aiRestore('prev') }, 'ຍົກເລີກ AI ຄັ້ງລ່າສຸດ') : null,
      h('button', { class: 'btn ghost', onclick: () => aiRestore('orig') }, 'ກັບຄືນຮູບຕົ້ນສະບັບ')));
  }
  p.append(h('div', { class: 'btnrow' }, h('button', { class: 'btn ghost', onclick: () => aiSettingsSheet() }, '⚙ ຕັ້ງຄ່າ AI' + (c.key ? ' (ໃສ່ key ແລ້ວ)' : ''))));
}
